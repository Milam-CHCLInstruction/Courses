<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CHCL Course Access - Password Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .lock-icon {
            font-size: 4em;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .instructor-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }

        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #3498db;
        }

        .submit-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #c62828;
        }

        .back-link {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #2980b9;
        }

        .info-text {
            color: #666;
            font-size: 0.95em;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">🔒</div>
        <h1>Basic CHCL Course</h1>
        <p class="subtitle">Student Access Portal</p>
        
        <div class="instructor-info">
            <strong>Wes Milam</strong><br>
            AR CHCL Instructor #24-1604<br>
            Fort Smith, Arkansas
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Enter Course Password:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter instructor password"
                    required
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
            </div>

            <button type="submit" class="submit-btn">Access Course Materials</button>
        </form>

        <div id="errorMessage" class="error-message">
            Incorrect password. Please try again or contact your instructor.
        </div>

        <p class="info-text">
            Instructor password required.
        </p>

        <div class="back-link">
            <a href="https://milam-chclinstruction.github.io/Courses/">← Back to Main Page</a>
        </div>
    </div>

    <script>
        // Change the password here
        const CORRECT_PASSWORD = "Flynn's Arcade";
        // Page to open after a correct password (must match the file name in the repo exactly)
        const DESTINATION = "basic-presentation.html";

        // Converts curly quotes/apostrophes to straight ones and trims spaces,
        // so phone/Mac "smart punctuation" doesn't cause a mismatch
        function normalize(text) {
            return text
                .replace(/[\u2018\u2019\u201A\u201B\u2032\u0060\u00B4]/g, "'")
                .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
                .replace(/\s+/g, " ")
                .trim();
        }

        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (normalize(passwordInput.value) === normalize(CORRECT_PASSWORD)) {
                window.location.href = DESTINATION;
            } else {
                errorMessage.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => { errorMessage.style.display = 'none'; }, 3000);
            }
        });

        passwordInput.addEventListener('input', function () {
            errorMessage.style.display = 'none';
        });
    </script>
</body>
</html>
